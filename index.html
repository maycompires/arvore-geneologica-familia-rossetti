<meta charset="UTF-8">
<title>Árvore Rossetti</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Esta versão guarda as fotos da família no Firebase (Firestore), não como
     um artefato do Claude. Veja GUIA-CONFIGURACAO-FIREBASE.md para ativar. -->
<style>
  :root{
    --bg:#0a170f;
    --bg-soil:#150d08;
    --bark:#6b4a34;
    --bark-deep:#3c2a1c;
    --bark-light:#8a6242;
    --leaf:#4f7d52;
    --leaf-bright:#8fc283;
    --leaf-deep:#2c4a30;
    --gold:#d9a441;
    --gold-bright:#f0c26a;
    --gold-dim:#8a6b2f;
    --parchment:#ece3cc;
    --ink-soft:#a9b6a0;
    --panel:rgba(15,30,19,0.82);
    --panel-line:rgba(217,164,65,0.28);
    --shadow:rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);}
  body{
    font-family:'EB Garamond', serif;
    color:var(--parchment);
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------------- ambient forest ground (fixed, does not pan) ---------------- */
  .atmosphere{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 45% at 20% 15%, rgba(143,194,131,0.08), transparent 60%),
      radial-gradient(ellipse 60% 40% at 82% 10%, rgba(217,164,65,0.07), transparent 60%),
      radial-gradient(ellipse 90% 60% at 50% 100%, rgba(60,42,28,0.55), transparent 65%),
      linear-gradient(180deg, #0d1d13 0%, #0a170f 45%, #0b130c 100%);
  }
  .atmosphere .grain{
    position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay;
  }
  .motes{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .mote{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 6px 1px rgba(240,194,106,0.7);
    opacity:0.55;
    animation:drift 26s ease-in-out infinite;
  }
  @keyframes drift{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:0.6; }
    50%{ transform:translate(14px,-70px); }
    90%{ opacity:0.5; }
    100%{ transform:translate(-8px,-160px); opacity:0; }
  }

  /* ---------------- toolbar ---------------- */
  .toolbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:18px;
    padding:12px max(22px, env(safe-area-inset-right)) 12px max(22px, env(safe-area-inset-left));
    background:#0f1e13;
    border-bottom:1px solid var(--panel-line);
    backdrop-filter:blur(10px);
    flex-wrap:wrap;
    box-shadow:0 8px 24px rgba(0,0,0,0.16);
    transition:transform .25s ease;
  }
  .brand{ display:flex; flex-direction:column; gap:1px; margin-right:6px; }
  .brand .mark{
    font-family:'Cinzel', serif; font-weight:600;
    font-size:19px; letter-spacing:0.03em;
    color:var(--gold-bright);
    white-space:nowrap;
  }
  .brand .sub{
    font-family:'Manrope', sans-serif; font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ink-soft); opacity:0.75;
  }
  .search-wrap{ position:relative; flex:1 1 240px; max-width:320px; }
  .search-wrap input{
    width:100%;
    font-family:'Manrope', sans-serif; font-size:13.5px;
    background:rgba(10,23,15,0.6);
    border:1px solid var(--panel-line);
    color:var(--parchment);
    padding:9px 36px 9px 32px;
    border-radius:8px;
    outline:none;
  }
  .search-wrap input::placeholder{ color:var(--ink-soft); opacity:0.65; }
  .search-wrap input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,164,65,0.15); }
  .search-wrap::before{
    content:"🔎"; position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-size:12px; opacity:0.7;
  }
  .search-clear{
    position:absolute; right:7px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; padding:0;
    border:0; border-radius:5px;
    color:var(--ink-soft); background:transparent;
    font-family:'Manrope', sans-serif; font-size:19px; line-height:1;
    cursor:pointer; opacity:0; pointer-events:none;
    transition:opacity .18s, color .18s, background .18s;
  }
  .search-wrap.has-value .search-clear{ opacity:1; pointer-events:auto; }
  .search-clear:hover, .search-clear:focus-visible{
    color:var(--parchment); background:rgba(240,194,106,0.12); outline:none;
  }
  .search-count{
    font-family:'Manrope', sans-serif; font-size:11px; color:var(--gold-bright);
    min-width:80px;
  }
  .zoom-controls{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .zoom-controls button{
    width:32px; height:32px;
    border-radius:7px;
    border:1px solid var(--panel-line);
    background:rgba(10,23,15,0.55);
    color:var(--parchment);
    font-family:'Manrope', sans-serif; font-size:15px; font-weight:600;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .18s, border-color .18s;
  }
  .zoom-controls button:hover, .zoom-controls button:focus-visible{
    background:rgba(217,164,65,0.16); border-color:var(--gold); outline:none;
  }
  button:focus-visible, input:focus-visible, [role="button"]:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:3px;
  }
  .zoom-controls .fit-btn{ width:auto; padding:0 12px; font-size:11.5px; letter-spacing:0.04em; }
  .stats-pill{
    font-family:'Manrope', sans-serif; font-size:11px; letter-spacing:0.03em;
    color:var(--gold-bright);
    border:1px solid var(--panel-line);
    padding:6px 14px; border-radius:999px;
    background:rgba(217,164,65,0.06);
    white-space:nowrap;
  }
  .hint{
    position:fixed; right:22px; bottom:18px; z-index:20;
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:13px;
    color:var(--ink-soft); opacity:0.75; text-align:right;
    max-width:240px;
  }

  /* ---------------- stage / canvas (pan & zoom) ---------------- */
  .stage{
    position:fixed; inset:0; z-index:2;
    overflow:hidden;
    cursor:grab;
    touch-action:none; /* o próprio JS cuida de arrastar e do pinça-para-zoom */
  }
  .stage.dragging{ cursor:grabbing; }
  .canvas{
    position:absolute; top:0; left:0;
    transform-origin:0 0;
    opacity:0;
  }
  .canvas.ready{ opacity:1; transition:opacity .7s ease; }
  .canvas.animated{ transition:transform .35s cubic-bezier(.2,.7,.3,1), opacity .7s ease; }
  svg.edges{ position:absolute; top:0; left:0; overflow:visible; }

  /* ---------------- nodes ---------------- */
  .node{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; gap:8px;
    cursor:pointer;
    user-select:none;
    padding:5px 12px 5px 5px;
    border-radius:999px;
    border:1px solid transparent;
    background:rgba(10,20,13,0.0);
    transition:background .2s, border-color .2s, transform .15s;
    white-space:nowrap;
  }
  .node.magnified{
    z-index:12;
    transform:translate(-50%,-50%) scale(1.42);
    background:rgba(217,164,65,0.16);
    border-color:var(--panel-line);
    box-shadow:0 0 0 4px rgba(217,164,65,0.13), 0 8px 18px rgba(0,0,0,0.28);
  }
  .node:hover, .node:focus-visible{
    background:rgba(217,164,65,0.12);
    border-color:var(--panel-line);
    outline:none;
  }
  .node.dim{ opacity:0.16; }
  .node.match{
    background:rgba(217,164,65,0.22);
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(217,164,65,0.12);
  }
  .avatar{
    border-radius:50%; flex-shrink:0;
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid rgba(236,227,204,0.35);
    font-family:'Cinzel', serif; font-weight:600;
    color:rgba(236,227,204,0.9);
  }
  .avatar.has-photo .init{ display:none; }
  .name{ letter-spacing:0.01em; }
  .voce-tag{
    font-family:'Manrope', sans-serif; font-style:normal; font-size:10px;
    color:var(--bg); background:var(--gold-bright);
    padding:1px 8px; border-radius:999px; margin-left:4px;
    vertical-align:middle;
  }
  .leaf-mark{
    width:9px; height:9px; margin-right:1px; flex-shrink:0;
    background:var(--leaf-bright);
    clip-path:polygon(50% 0%, 90% 35%, 65% 100%, 35% 100%, 10% 35%);
    opacity:0.85;
  }
  mark{ background:rgba(217,164,65,0.55); color:#1a1108; border-radius:3px; padding:0 2px; }

  /* depth 1 — the nine boughs */
  .node.bough{ padding:9px 20px 9px 8px; }
  .node.bough .avatar{ width:40px; height:40px; font-size:14px; }
  .node.bough .name{ font-family:'Cinzel', serif; font-weight:600; font-size:19px; color:var(--gold-bright); }

  /* depth 2 */
  .node.limb .avatar{ width:30px; height:30px; font-size:11.5px; }
  .node.limb .name{ font-family:'EB Garamond', serif; font-weight:500; font-size:17.5px; color:var(--parchment); }

  /* depth 3+ interior */
  .node.twig .avatar{ width:24px; height:24px; font-size:10px; }
  .node.twig .name{ font-family:'EB Garamond', serif; font-size:16px; color:#cdd8c4; }

  /* leaves (no descendants) */
  .node.leaf-node .avatar{ width:20px; height:20px; font-size:8.5px; }
  .node.leaf-node .name{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:15px; color:var(--ink-soft); }

  /* ---------------- root plaque ---------------- */
  .root-plaque{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:22px 34px;
    border:1px solid var(--gold-dim);
    border-radius:6px;
    background:linear-gradient(180deg, rgba(217,164,65,0.10), rgba(60,42,28,0.35));
    box-shadow:0 18px 44px var(--shadow), inset 0 0 0 1px rgba(217,164,65,0.14);
    white-space:nowrap;
    z-index:3;
  }
  .root-plaque .eyebrow{
    font-family:'Manrope', sans-serif; font-size:10px; letter-spacing:0.28em;
    text-transform:uppercase; color:var(--gold-dim);
  }
  .root-couple{ display:flex; align-items:center; gap:14px; }
  .root-couple .amp{ color:var(--gold); font-family:'Cormorant Garamond', serif; font-style:italic; font-size:19px; }
  .root-stats{
    font-family:'Manrope', sans-serif; font-size:10px; letter-spacing:0.04em;
    color:var(--gold-bright); opacity:0.82; text-align:center;
    padding-top:9px; border-top:1px solid rgba(217,164,65,0.2);
  }
  .root-person{
    display:flex; align-items:center; gap:9px; cursor:pointer;
    padding:4px 8px 4px 4px; border-radius:20px; transition:background .2s;
  }
  .root-person.magnified{
    position:relative; z-index:12;
    transform:scale(1.28); transform-origin:center;
    background:rgba(217,164,65,0.16);
    box-shadow:0 0 0 4px rgba(217,164,65,0.13), 0 8px 18px rgba(0,0,0,0.28);
  }
  .root-person.dim{ opacity:0.16; }
  .root-person.match{
    background:rgba(217,164,65,0.22);
    box-shadow:0 0 0 4px rgba(217,164,65,0.12);
  }
  .root-person:hover, .root-person:focus-visible{ background:rgba(217,164,65,0.14); outline:none; }
  .root-person .avatar{ width:46px; height:46px; font-size:16px; }
  .root-person .name{ font-family:'Cinzel', serif; font-weight:600; font-size:18px; color:var(--parchment); }

  /* ---------------- lightbox ---------------- */
  .lightbox{
    position:fixed; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background:rgba(5,10,7,0.78);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox-card{
    position:relative;
    background:linear-gradient(180deg, #0f2015, #0a170f);
    border:1px solid var(--gold-dim);
    border-radius:16px;
    padding:44px 46px 34px;
    text-align:center; max-width:92vw;
    max-height:calc(100dvh - 32px); overflow:auto;
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
    transform:scale(0.94); transition:transform .25s ease;
  }
  .lightbox.open .lightbox-card{ transform:scale(1); }
  .lightbox-close{
    position:absolute; top:10px; right:14px; background:none; border:none;
    color:var(--ink-soft); font-size:28px; line-height:1; cursor:pointer;
  }
  .lightbox-close:hover{ color:var(--gold); }
  .lightbox-avatar-ring{
    width:190px; height:190px; border-radius:50%; padding:5px; margin:0 auto 20px;
    background:conic-gradient(from 180deg, var(--gold-dim), var(--gold-bright), var(--leaf), var(--gold-dim));
  }
  .lightbox-avatar{
    width:100%; height:100%; border-radius:50%;
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    border:4px solid #0a170f;
    font-family:'Cinzel', serif; font-size:52px; font-weight:600; color:rgba(236,227,204,0.9);
  }
  .lightbox-avatar.has-photo .init{ display:none; }
  .lightbox-name{
    font-family:'Cinzel', serif; font-size:clamp(19px,3vw,25px); color:var(--gold-bright);
    margin:0 0 20px; letter-spacing:0.01em;
  }
  .lightbox-upload{
    font-family:'Manrope', sans-serif; font-size:13.5px; font-weight:600;
    color:var(--gold-bright); background:rgba(217,164,65,0.10); border:1px solid var(--panel-line);
    padding:10px 24px; border-radius:999px; cursor:pointer; transition:background .2s, border-color .2s;
  }
  .lightbox-upload:hover{ background:rgba(217,164,65,0.2); border-color:var(--gold); }
  .lightbox-upload:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }
  .lightbox-upload:disabled{ opacity:0.55; cursor:default; }
  .lightbox-ascendencia{
    margin:16px 0 0; padding:12px 18px 0; border-top:1px solid var(--panel-line);
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:15.5px;
    line-height:1.45; color:var(--ink-soft); opacity:0.92; max-width:36ch;
  }
  .lightbox-ascendencia b{
    font-style:normal; font-weight:600; color:var(--gold-bright);
  }
  .lightbox-ascendencia.hide{ display:none; }
  .lightbox-hint{
    margin:12px 0 0; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:12px;
    color:var(--ink-soft); opacity:0.7;
  }
  .lightbox-status{
    margin:14px 0 0; min-height:15px;
    font-family:'Manrope', sans-serif; font-size:12.5px; font-weight:600;
    color:var(--gold-bright); opacity:0; transition:opacity .25s ease;
  }
  .lightbox-status.show{ opacity:1; }
  .lightbox-status.warn{ color:var(--wine-bright, #c98a8a); }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

  .fb-banner{
    display:none;
    flex:1 1 100%; order:5;
    font-family:'Manrope', sans-serif; font-size:12px; line-height:1.5;
    color:var(--gold-bright);
    background:rgba(217,164,65,0.10);
    border:1px solid var(--panel-line);
    border-radius:8px;
    padding:8px 14px;
    text-align:center;
  }
  .fb-banner.show{ display:block; }
  .fb-banner.erro{ background:rgba(190,70,70,0.16); color:#f0a9a9; border-color:rgba(190,70,70,0.35); }

  @media (max-width: 640px){
    .hint{ display:none; }
    .toolbar{
      display:grid; grid-template-columns:minmax(0, 1fr) minmax(150px, 1fr);
      gap:10px; padding:calc(10px + env(safe-area-inset-top)) 12px 12px;
      backdrop-filter:none; transition:top .25s ease;
    }
    .toolbar.mobile-hidden{ top:-100%; transform:none; pointer-events:none; }
    .brand{ grid-column:1; grid-row:1; min-width:0; align-items:flex-start; text-align:left; }
    .brand .mark{ font-size:16px; overflow:hidden; text-overflow:ellipsis; }
    .brand .sub{ font-size:9px; }
    .search-wrap{ grid-column:2; grid-row:1; max-width:none; width:100%; }
    .search-wrap::before{ display:none; }
    .search-wrap input{ text-align:center; padding-left:14px; }
    .search-count{ display:none; }
    .stats-pill{ display:none; }
    .zoom-controls{
      position:fixed; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); z-index:25;
      transform:translateX(-50%); display:flex; align-items:center; justify-content:center;
      gap:10px; margin:0; padding:6px 8px;
      border:1px solid var(--panel-line); border-radius:12px;
      background:rgba(15,30,19,0.9); box-shadow:0 8px 24px rgba(0,0,0,0.3);
      backdrop-filter:blur(10px);
    }
    .zoom-controls button{ width:40px; height:40px; font-size:18px; }
    .zoom-controls .fit-btn{ display:none; }
    .zoom-label{ display:block; padding:0 3px; color:var(--ink-soft); font-family:'Manrope', sans-serif; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; }
    .fb-banner{ grid-column:1 / -1; grid-row:2; }
    .lightbox{ padding:20px; align-items:center; }
    .lightbox-card{
      width:100%; max-width:410px; height:calc(100% - 40px); max-height:none;
      padding:calc(42px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      border-radius:12px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .lightbox-avatar-ring{ width:142px; height:142px; margin-bottom:14px; }
    .lightbox-name{ margin-bottom:16px; }
    .lightbox-upload{ width:100%; min-height:44px; }
  }
  @media (pointer: coarse){
    /* alvos de toque maiores para dedo, sem mudar a leitura no desktop */
    .node{ padding:7px 14px 7px 6px; }
    .zoom-controls button{ width:40px; height:40px; }
  }
</style>

<div class="atmosphere"><div class="grain"></div></div>
<div class="motes" id="motes"></div>

<header class="toolbar">
  <div class="brand">
    <span class="mark">Família Rossetti</span>
    <span class="sub">Árvore genealógica</span>
  </div>
  <div class="search-wrap">
    <input type="text" id="busca" placeholder="Buscar um nome…" autocomplete="off" aria-label="Buscar um nome na árvore">
    <button class="search-clear" id="limparBusca" type="button" aria-label="Limpar busca" title="Limpar busca">&times;</button>
  </div>
  <span class="search-count" id="searchCount"></span>
  <div class="zoom-controls">
    <button id="zoomOut" aria-label="Diminuir zoom">–</button>
    <span class="zoom-label">zoom</span>
    <button id="zoomIn" aria-label="Aumentar zoom">+</button>
    <button id="zoomFit" class="fit-btn">Ver árvore inteira</button>
  </div>
  <p class="fb-banner" id="fbBanner"></p>
</header>

<div class="hint">arraste para mover · roda do mouse para zoom<br>toque em qualquer nome para ver ou adicionar uma foto</div>

<main class="stage" id="stage">
  <div class="canvas" id="canvas"></div>
</main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-card">
    <button class="lightbox-close" id="lightboxClose" aria-label="Fechar">&times;</button>
    <div class="lightbox-avatar-ring">
      <div class="lightbox-avatar" id="lightboxAvatar">
        <span class="init" id="lightboxInitials"></span>
      </div>
    </div>
    <p class="lightbox-name" id="lightboxName"></p>
    <button class="lightbox-upload" id="lightboxUpload">📷 Adicionar / trocar foto</button>
    <p class="lightbox-ascendencia" id="lightboxAscendencia"></p>
    <p class="lightbox-status" id="lightboxStatus" aria-live="polite"></p>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" class="sr-only">

<script type="module">

import {
  getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

   ficam compartilhadas entre as pessoas que abrirem o link. */
const firebaseConfig = {

  authDomain: "arvore-rossetti-d89e2.firebaseapp.com",

/* ======================= AVATAR (cor + iniciais) ======================= */
const PALETA = ["#3c5a45","#6b3a44","#4a4a2f","#38506b","#5c4630","#4f3a5c","#345349","#5a3a3a","#6b4a34"];
function hash(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function corAvatar(nome){ return PALETA[hash(nome) % PALETA.length]; }
function iniciais(nome){
  const p = nome.trim().split(/\s+/);
  return ((p[0]?p[0][0]:"") + (p.length>1?p[p.length-1][0]:"")).toUpperCase();
}

function ascendenciaDe(node){
  if(!node || !node.parent) return null; /* é o próprio casal-raiz — sem ascendência a mostrar */
  const elos = [];
  let cur = node, k = 0;
  while(cur.parent){
    k++;
    elos.push({ k, nome: cur.parent === treeRoot ? "Pedro e Verônica Rossetti" : cur.parent.name });
    cur = cur.parent;
  }
  const termos = TERMOS_GERACAO[GENERO[node.name]] || TERMOS_GERACAO.n;
  return elos.map(e => `${termos[Math.min(e.k, termos.length-1)]} de <b>${e.nome}</b>`).join(", ");
}
function mix(hexA, hexB, t){
  const a=[1,3,5].map(i=>parseInt(hexA.substr(i,2),16));
  const b=[1,3,5].map(i=>parseInt(hexB.substr(i,2),16));
  const c=a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function lerp(a,b,t){ return a+(b-a)*t; }

/* ======================= CONSTRUÇÃO DA ÁRVORE ======================= */
function toNode(item){
  if (typeof item === "string") return { name: item, children: [] };
  return { name: item.nome, children: (item.filhos || []).map(toNode) };
}

function assignIds(node, path){

}

let maxDepth = 0;
function computeDepth(node, d){ node.depth = d; maxDepth = Math.max(maxDepth, d); node.children.forEach(c=>computeDepth(c,d+1)); }

/* linhas verticais: tronco mais longo entre raiz e os 9 ramos, depois entrenós regulares */
const ROW_GAP = 176;
const TRUNK_GAP = 240;
const TOP_MARGIN = 90;
const PLAQUE_OFFSET = 172; /* distância do ponto de convergência dos galhos até o centro da placa dos bisavós */
const PLAQUE_HALF_H = 60;
const BOTTOM_MARGIN = PLAQUE_OFFSET + PLAQUE_HALF_H + 40;
const SIDE_MARGIN = 90;
const LEAF_W = 60;

/* estilo por profundidade — precisa existir antes do cálculo de largura,
   pois cada rótulo reserva espaço suficiente para não se sobrepor ao vizinho */
function classForDepth(depth, isLeaf){
  if(depth === 1) return "bough";
  if(depth === 2) return "limb";
  if(isLeaf) return "leaf-node";
  return "twig";
}
function avatarSize(depth, isLeaf){
  if(depth === 1) return 40;
  if(depth === 2) return 30;
  if(isLeaf) return 20;
  return 24;
}
function charWidthFor(node){
  if(node.depth === 1) return 11.6;
  if(node.depth === 2) return node.children.length ? 9.6 : 8.4;
  return node.children.length ? 8.8 : 7.8;
}
function estimateOwnUnits(node){
  const isLeaf = node.children.length === 0;
  const overhead = avatarSize(node.depth, isLeaf) + 40 + (/Maycom/i.test(node.name) ? 46 : 0) + (isLeaf ? 12 : 0);
  const px = overhead + node.name.length * charWidthFor(node);
  return px / LEAF_W + 0.55;
}
function computeWeight(node){
  const own = estimateOwnUnits(node);
  if(!node.children.length){ node.weight = Math.max(own, 1); return node.weight; }
  let w = 0; node.children.forEach(c => w += computeWeight(c));
  node.weight = Math.max(w, own);
  return node.weight;
}
computeWeight(treeRoot);

const rowY = new Array(maxDepth+1);
rowY[maxDepth] = TOP_MARGIN;
for(let d = maxDepth-1; d >= 0; d--){
  rowY[d] = rowY[d+1] + (d === 0 ? TRUNK_GAP : ROW_GAP);
}
const canvasHeight = rowY[0] + BOTTOM_MARGIN;
const totalWidth = treeRoot.weight * LEAF_W;
const canvasWidth = totalWidth + SIDE_MARGIN * 2;

function jitterFor(node){
  const h = hash(node.id + node.name);
  const signY = (h % 2 === 0) ? 1 : -1;
  const signX = ((h >> 3) % 2 === 0) ? 1 : -1;
  const jy = node.depth <= 1 ? 0 : signY * lerp(3, 16, (node.depth-1)/Math.max(maxDepth-1,1)) * ((h%7)/7);
  const jx = node.depth <= 1 ? 0 : signX * lerp(0, 12, (node.depth-1)/Math.max(maxDepth-1,1)) * ((h%5)/5);
  return { jx, jy };
}

function layout(node, x0, x1){
  node.cx = (x0 + x1) / 2 + SIDE_MARGIN;
  node.baseY = rowY[node.depth];
  const { jx, jy } = jitterFor(node);
  node.cx += jx;
  node.y = node.baseY + jy;
  if(node.children.length){
    const childrenWeight = node.children.reduce((s,c) => s + c.weight, 0);
    const usedWidth = (childrenWeight / node.weight) * (x1 - x0);
    let cursor = x0 + ((x1 - x0) - usedWidth) / 2;
    node.children.forEach(c => {
      const w = (c.weight / node.weight) * (x1 - x0);
      layout(c, cursor, cursor + w);
      cursor += w;
    });
  }
}
layout(treeRoot, 0, totalWidth);

function edgeColor(depth){
  const t = depth / maxDepth;
  if(t < 0.55) return mix("#4a3320", "#4f7d52", t/0.55);
  return mix("#4f7d52", "#d9a441", (t-0.55)/0.45);
}
function edgeWidth(depth){ return lerp(15, 1.6, depth/maxDepth); }

const edgeGeoms = [];
edges.forEach(([p,c]) => {
  const x1=p.cx, y1=p.y, x2=c.cx, y2=c.y;
  const dy = (y1-y2)*0.55;
  const jitter = (hash(c.id) % 21) - 10;
  const c1x = x1 + jitter*0.5, c1y = y1 - dy;
  const c2x = x2 - jitter*0.5, c2y = y2 + dy;
  const path = document.createElementNS(svgNS, "path");
  path.setAttribute("d", `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", edgeColor(c.depth));
  path.setAttribute("stroke-width", edgeWidth(c.depth).toFixed(2));
  path.setAttribute("stroke-linecap", "round");
  svg.appendChild(path);
  edgeGeoms.push({ x1,y1,c1x,c1y,c2x,c2y,x2,y2, depth:c.depth, id:c.id });
});

/* folhagem decorativa: pequenas folhas soltas ao longo dos galhos, sempre
   desenhadas atrás dos nomes (o SVG inteiro fica abaixo dos cartões de texto
   no HTML) e só no meio de cada galho — nunca perto das pontas onde os nomes
   ficam — para dar textura de árvore sem atrapalhar a leitura */
function bezierPoint(x1,y1,c1x,c1y,c2x,c2y,x2,y2,t){
  const mt = 1-t;
  const x = mt*mt*mt*x1 + 3*mt*mt*t*c1x + 3*mt*t*t*c2x + t*t*t*x2;
  const y = mt*mt*mt*y1 + 3*mt*mt*t*c1y + 3*mt*t*t*c2y + t*t*t*y2;
  const dx = 3*mt*mt*(c1x-x1) + 6*mt*t*(c2x-c1x) + 3*t*t*(x2-c2x);
  const dy = 3*mt*mt*(c1y-y1) + 6*mt*t*(c2y-c1y) + 3*t*t*(y2-c2y);
  return { x, y, dx, dy };
}
/* folha em forma de gota alongada (nervura central + pecíolo), desenhada em
   espaço local com a base em (0,0) e a ponta em (0,-L) — assim rotacionamos
   o grupo inteiro para "colar" o pecíolo na linha do galho */
function leafGroup(x, y, angleDeg, L, fill, opacity){
  const W = L * 0.4;
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${angleDeg.toFixed(1)})`);
  g.setAttribute("opacity", opacity.toFixed(2));

  const stem = document.createElementNS(svgNS, "path");
  stem.setAttribute("d", `M0,0 Q ${(W*0.18).toFixed(1)},${(L*0.1).toFixed(1)} 0,${(L*0.22).toFixed(1)}`);
  stem.setAttribute("fill", "none");
  stem.setAttribute("stroke", "#3c2a1c");
  stem.setAttribute("stroke-width", Math.max(1, L*0.07).toFixed(2));
  stem.setAttribute("stroke-linecap", "round");
  g.appendChild(stem);

  const blade = document.createElementNS(svgNS, "path");
  blade.setAttribute("d", `M0,0 C ${-W},${(-L*0.14).toFixed(1)} ${(-W*0.86).toFixed(1)},${(-L*0.66).toFixed(1)} 0,${(-L).toFixed(1)} C ${(W*0.86).toFixed(1)},${(-L*0.66).toFixed(1)} ${W},${(-L*0.14).toFixed(1)} 0,0 Z`);
  blade.setAttribute("fill", fill);
  g.appendChild(blade);

  const vein = document.createElementNS(svgNS, "path");
  vein.setAttribute("d", `M0,${(-L*0.06).toFixed(1)} Q ${(W*0.14).toFixed(1)},${(-L*0.5).toFixed(1)} 0,${(-L*0.93).toFixed(1)}`);
  vein.setAttribute("fill", "none");
  vein.setAttribute("stroke", "#25391f");
  vein.setAttribute("stroke-width", Math.max(0.6, L*0.032).toFixed(2));
  vein.setAttribute("opacity", "0.5");
  g.appendChild(vein);

  return g;
}
function foliageColor(depthT){
  const t = Math.max(0, Math.min(1, depthT));
  if(t < 0.5) return mix("#3f6b46", "#8fc283", t/0.5);
  return mix("#8fc283", "#e8c96b", (t-0.5)/0.5);
}
(function scatterFoliage(){
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("aria-hidden", "true");
  edgeGeoms.forEach(edge => {
    if(edge.depth === 1) return; /* tronco e galhos principais ficam limpos */
    const len = Math.hypot(edge.x2-edge.x1, edge.y2-edge.y1);
    const seed = hash(edge.id);
    let count = len > 300 ? 3 : (len > 170 ? 2 : (len > 80 ? 1 : ((seed % 4 === 0) ? 1 : 0)));
    const edgeHalfW = edgeWidth(edge.depth) / 2;
    for(let i=0; i<count; i++){
      const r1 = (hash(edge.id + "a" + i) % 1000) / 1000;
      const r2 = (hash(edge.id + "b" + i) % 1000) / 1000;
      const r3 = (hash(edge.id + "c" + i) % 1000) / 1000;
      const r4 = (hash(edge.id + "d" + i) % 1000) / 1000;
      const t = 0.26 + r1 * 0.48; /* longe das duas pontas, onde os nomes ficam */
      const pt = bezierPoint(edge.x1,edge.y1,edge.c1x,edge.c1y,edge.c2x,edge.c2y,edge.x2,edge.y2, t);
      const mag = Math.hypot(pt.dx, pt.dy) || 1;
      const perpX = -pt.dy/mag, perpY = pt.dx/mag;
      const side = (i % 2 === 0) ? 1 : -1;
      /* o pecíolo nasce bem na borda do galho — "colado" nele — e a folha se abre para fora */
      const baseOffset = edgeHalfW + 1.5;
      const anchorX = pt.x + perpX * baseOffset * side;
      const anchorY = pt.y + perpY * baseOffset * side;
      const outward = Math.atan2(perpX*side, -perpY*side) * 180/Math.PI;
      const angle = outward + (r3 - 0.5) * 46;
      const L = 19 + r4 * 17; /* folhas maiores e mais variadas em tamanho */
      const depthT = (edge.depth-1) / Math.max(maxDepth-1, 1) + (r1-0.5)*0.18;
      const opacity = 0.62 + r2*0.3;
      g.appendChild(leafGroup(anchorX, anchorY, angle, L, foliageColor(depthT), opacity));
    }
  });
  svg.appendChild(g);
})();

/* raiz da árvore: os 9 galhos convergem num só ponto, que se abre em 6 raízes
   marrons — cada uma desce e encosta diretamente na borda de cima da placa,
   como se a placa estivesse assentada sobre as raízes da família */
(function drawRoots(){
  const g = document.createElementNS(svgNS, "g");
  const cx = treeRoot.cx, y0 = treeRoot.y;
  const plaqueTop = plaqueY - rootPlaque.offsetHeight / 2;
  const halfW = rootPlaque.offsetWidth / 2;
  const spread = [-0.86, -0.5, -0.16, 0.16, 0.5, 0.86];
  spread.forEach((f, i) => {
    const dx = f * halfW;
    const endX = cx + dx, endY = plaqueTop + 3;
    const c1x = cx + dx * 0.25, c1y = y0 + 46;
    const c2x = endX, c2y = plaqueTop - 62;
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", `M ${cx} ${y0} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${endX} ${endY}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#3c2a1c");
    path.setAttribute("stroke-width", (9 - Math.abs(i - 2.5) * 1.3).toFixed(1));
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("opacity", "0.85");
    g.appendChild(path);
  });
  svg.insertBefore(g, svg.firstChild);
})();

/* ======================= PAN & ZOOM ======================= */
const stage = document.getElementById("stage");
let scale = 1, tx = 0, ty = 0;
let userMoved = false;

function applyTransform(){
  canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}
function fitToBox(x0,y0,x1,y1,pad,animated){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const bw = (x1-x0) + pad*2, bh = (y1-y0) + pad*2;
  let s = Math.min(sw/bw, sh/bh);
  s = Math.max(0.05, Math.min(s, 2.4));
  const cxm = (x0+x1)/2, cym = (y0+y1)/2;
  scale = s;
  tx = sw/2 - cxm*s;
  ty = sh/2 - cym*s;
  canvas.classList.toggle("animated", !!animated);
  applyTransform();
}
function fitAll(animated){ fitToBox(0,0,canvasWidth,canvasHeight,40,animated); }
function initialView(animated){
  /* a árvore completa é bem mais larga que alta (89 pessoas lado a lado) —
     no primeiro momento mostramos a copa centrada na raiz, em altura cheia,
     para que ela realmente pareça uma árvore; "ver árvore inteira" afasta a câmera */
  const sw = stage.clientWidth, sh = stage.clientHeight;
  let s = (sh - 130) / canvasHeight;
  const isMobile = window.matchMedia("(max-width: 640px)").matches;
  s = isMobile ? Math.max(0.62, Math.min(s, 1.05)) : Math.max(0.4, Math.min(s, 1.15));
  scale = s;
  tx = sw/2 - treeRoot.cx*s;
  ty = sh - (isMobile ? 100 : 85) - canvasHeight*s;
  canvas.classList.toggle("animated", !!animated);
  applyTransform();
}

let toolbarRevealTimer = null;
function agendarRetornoCabecalho(){
  if(!window.matchMedia("(max-width: 640px)").matches) return;
  clearTimeout(toolbarRevealTimer);
  toolbarRevealTimer = window.setTimeout(() => {
    document.querySelector(".toolbar").classList.remove("mobile-hidden");
  }, 1800);
}

/* arrastar com 1 dedo/mouse, ou pinçar com 2 dedos para zoom — no celular
   os dois gestos precisam conviver, então guardamos todos os ponteiros ativos */
const activePointers = new Map();
let dragging = false, startX=0, startY=0, startTx=0, startTy=0, moved=0;
let pinching = false, lastPinchDist=0, lastPinchMidX=0, lastPinchMidY=0;

function pointersArray(){ return Array.from(activePointers.values()); }
function distBetween(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function midBetween(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }

function beginSingleDrag(p){
  dragging = true; pinching = false; moved = 0;
  startX = p.x; startY = p.y; startTx = tx; startTy = ty;
  stage.classList.add("dragging");
  canvas.classList.remove("animated");
}
function beginPinch(){
  const [a,b] = pointersArray();
  dragging = false; pinching = true;
  lastPinchDist = distBetween(a,b);
  const mid = midBetween(a,b);
  lastPinchMidX = mid.x; lastPinchMidY = mid.y;
  canvas.classList.remove("animated");
}

let magnifiedElement = null;
function atualizarLupa(clientX, clientY){
  const sobPonteiro = document.elementFromPoint(clientX, clientY);
  const alvo = sobPonteiro && sobPonteiro.closest ? sobPonteiro.closest(".node, .root-person") : null;
  const alvoValido = alvo && canvas.contains(alvo) ? alvo : null;
  if(magnifiedElement === alvoValido) return;
  if(magnifiedElement) magnifiedElement.classList.remove("magnified");
  magnifiedElement = alvoValido;
  if(magnifiedElement) magnifiedElement.classList.add("magnified");
}
function limparLupa(){
  if(magnifiedElement) magnifiedElement.classList.remove("magnified");
  magnifiedElement = null;
}

stage.addEventListener("pointerdown", (e) => {
  if(e.target.closest(".node, .root-person, button, input")) return;
  try{ stage.setPointerCapture(e.pointerId); }catch(err){ /* ignora — segue sem captura */ }
  activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(activePointers.size === 1){
    beginSingleDrag(activePointers.get(e.pointerId));
  } else if(activePointers.size === 2){
    beginPinch();
  }
});
stage.addEventListener("pointermove", (e) => {
  atualizarLupa(e.clientX, e.clientY);
  if(!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if(pinching && activePointers.size >= 2){
    const [a,b] = pointersArray();
    const dist = distBetween(a,b);
    const mid = midBetween(a,b);
    if(lastPinchDist > 0){
      userMoved = true;
      zoomAt(mid.x, mid.y, dist / lastPinchDist);
      tx += mid.x - lastPinchMidX;
      ty += mid.y - lastPinchMidY;
      applyTransform();
    }
    lastPinchDist = dist; lastPinchMidX = mid.x; lastPinchMidY = mid.y;
    return;
  }
  if(dragging){
    const dx = e.clientX - startX, dy = e.clientY - startY;
    moved = Math.max(moved, Math.abs(dx)+Math.abs(dy));
    tx = startTx + dx; ty = startTy + dy;
    applyTransform();
  }
});
function endDrag(e){
  if(activePointers.has(e.pointerId)) activePointers.delete(e.pointerId);
  if(moved > 4) userMoved = true;
  if(activePointers.size === 1){
    /* ainda sobrou um dedo na tela — retoma o arraste sem pular */
    beginSingleDrag(pointersArray()[0]);
  } else if(activePointers.size === 0){
    dragging = false; pinching = false;
    stage.classList.remove("dragging");
    limparLupa();
  }
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", () => {
  if(activePointers.size === 0) limparLupa();
});

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  userMoved = true;
  canvas.classList.remove("animated");
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive:false });

function zoomAt(clientX, clientY, factor){
  if(window.matchMedia("(max-width: 640px)").matches){
    document.querySelector(".toolbar").classList.add("mobile-hidden");
    agendarRetornoCabecalho();
  }
  const rect = stage.getBoundingClientRect();
  const px = clientX - rect.left, py = clientY - rect.top;
  const cxCanvas = (px - tx) / scale, cyCanvas = (py - ty) / scale;
  scale = Math.max(0.05, Math.min(scale * factor, 3));
  tx = px - cxCanvas * scale;
  ty = py - cyCanvas * scale;
  applyTransform();
}
document.getElementById("zoomIn").addEventListener("click", () => {
  userMoved = true; canvas.classList.add("animated");
  zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.25);
});
document.getElementById("zoomOut").addEventListener("click", () => {
  userMoved = true; canvas.classList.add("animated");
  zoomAt(stage.clientWidth/2, stage.clientHeight/2, 0.8);
});
document.getElementById("zoomFit").addEventListener("click", () => { userMoved = true; fitAll(true); });

window.addEventListener("resize", () => { if(!userMoved) initialView(false); });

/* estado inicial */
initialView(false);

/* ======================= BUSCA ======================= */
const buscaInput = document.getElementById("busca");
const searchWrap = document.querySelector(".search-wrap");
const limparBusca = document.getElementById("limparBusca");
const searchCount = document.getElementById("searchCount");
let indiceResultadoBusca = 0;
function normalizarBusca(texto){
  return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}
function focarResultado(indice){
  const matches = Array.from(canvas.querySelectorAll(".node.match, .root-person.match"));
  if(!matches.length) return false;
  const canvasRect = canvas.getBoundingClientRect();
  const posicaoNoCanvas = el => {
    const rect = el.getBoundingClientRect();
    return {
      x: (rect.left + rect.width / 2 - canvasRect.left) / scale,
      y: (rect.top + rect.height / 2 - canvasRect.top) / scale
    };
  };
  matches.sort((a, b) => posicaoNoCanvas(a).x - posicaoNoCanvas(b).x);
  const alvo = matches[indice % matches.length];
  const posicao = posicaoNoCanvas(alvo);
  userMoved = true;
  fitToBox(posicao.x-70,posicao.y-50,posicao.x+70,posicao.y+50,70,true);
  return true;
}
function atualizarBusca(){
  const termo = normalizarBusca(buscaInput.value.trim());
  const nodeEls = canvas.querySelectorAll(".node, .root-person");
  indiceResultadoBusca = 0;
  searchWrap.classList.toggle("has-value", !!termo);
  if(!termo){
    nodeEls.forEach(el => el.classList.remove("dim","match"));
    searchCount.textContent = "";
    initialView(true);
    return;
  }
  let count = 0;
  nodeEls.forEach(el => {
    const isMatch = normalizarBusca(el.dataset.name).includes(termo);
    el.classList.toggle("match", isMatch);
    el.classList.toggle("dim", !isMatch);
    if(isMatch) count++;
  });
  searchCount.textContent = count ? `${count} encontrado${count>1?"s":""} · Enter para focar` : "nenhum encontrado";
  if(count) focarResultado(0);
}
buscaInput.addEventListener("input", atualizarBusca);
limparBusca.addEventListener("click", () => {
  buscaInput.value = "";
  atualizarBusca();
  buscaInput.focus();
});
buscaInput.addEventListener("keydown", (e) => {
  if(e.key !== "Enter") return;
  const focado = focarResultado(indiceResultadoBusca);
  if(!focado) return;
  indiceResultadoBusca++;
});

function redimensionarImagem(file, maxLado, qualidade){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxLado){ h = Math.round(h*maxLado/w); w = maxLado; } }
        else { if(h > maxLado){ w = Math.round(w*maxLado/h); h = maxLado; } }
        const canvasEl = document.createElement("canvas");
        canvasEl.width = w; canvasEl.height = h;
        canvasEl.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvasEl.toDataURL("image/jpeg", qualidade));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
/* o Firestore limita cada documento a ~1 MiB — comprimimos com folga generosa
   (bem abaixo disso) e, no caso raro de uma imagem muito "pesada" mesmo depois
   de reduzida, tentamos de novo menor/mais comprimida antes de desistir */
const LIMITE_BASE64 = 700000;
async function prepararFotoParaEnvio(file){
  const tentativas = [ [700, 0.86], [550, 0.78], [400, 0.68] ];
  let ultima = null;
  for(const [maxLado, qualidade] of tentativas){
    ultima = await redimensionarImagem(file, maxLado, qualidade);
    if(ultima.length <= LIMITE_BASE64) return ultima;
  }
  throw new Error("imagem-grande-demais");
}
fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if(!file || !editandoId) return;
  const id = editandoId;
  const nome = editandoNome;
  try{
    const dataUrl = await prepararFotoParaEnvio(file);
    fotosFamilia[id] = dataUrl;
    aplicarFoto(id, dataUrl);

    lightboxUpload.disabled = true;
    mostrarStatusFoto(firestorePronto ? "Publicando para todo mundo…" : "Salvando…");
    const resultado = await publicarFoto(id, nome, dataUrl);
    lightboxUpload.disabled = false;

    if(resultado.ok){
      mostrarStatusFoto("✓ Publicada — todo mundo que abrir este link já vê essa foto.");
    } else if(resultado.motivo === "sem-configuracao"){
      mostrarStatusFoto("Foto salva só neste navegador (o Firebase ainda não está configurado nesta página).", "warn");
    } else if(resultado.motivo === "permission-denied"){
      mostrarStatusFoto("Foto salva só neste navegador — as regras de segurança do Firestore recusaram a publicação.", "warn");
    } else {
      mostrarStatusFoto("Não consegui publicar agora — a foto ficou só neste navegador. Tente de novo em instantes.", "warn");
    }
  }catch(e){
    console.error(e);
    mostrarStatusFoto("Não consegui usar essa imagem — tente outra foto, de preferência menor.", "warn");
  }
});
